<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasbPro · Suppliers</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="common.js"></script>
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <a href="dashboard.html" class="logo-container">
                <span class="logo-icon">K</span>
                <span class="logo-text">KasbPro</span>
            </a>

            <ul class="nav-menu-upper">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line nav-icon"></i><span class="link-text">Dashboard</span></a></li>
                <li class="nav-item"><a href="inventory.html" class="nav-link"><i class="fas fa-boxes-stacked nav-icon"></i><span class="link-text">Inventory</span></a></li>
                <li class="nav-item"><a href="customers.html" class="nav-link"><i class="fas fa-users nav-icon"></i><span class="link-text">Customers</span></a></li>
                <li class="nav-item active"><a href="suppliers.html" class="nav-link"><i class="fas fa-truck nav-icon"></i><span class="link-text">Suppliers</span></a></li>
                <li class="nav-item"><a href="billing.html" class="nav-link"><i class="fas fa-file-invoice-dollar nav-icon"></i><span class="link-text">Billing</span></a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link"><i class="fas fa-file-chart-column nav-icon"></i><span class="link-text">Reports</span></a></li>
                <li class="nav-item"><a href="ai-assistant.html" class="nav-link"><i class="fas fa-robot nav-icon"></i><span class="link-text">AI Assistant</span></a></li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-profile-info">
                    <div class="user-avatar-circle js-user-initial">U</div>
                    <div>
                        <p class="user-name js-user-name">User</p>
                        <p class="user-role js-user-role">Role</p>
                    </div>
                </div>
                <button class="logout-button" onclick="logout()">
                    <i class="fas fa-right-from-bracket logout-icon"></i>
                    <span class="link-text">Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1 class="page-title">Suppliers</h1>
                    <p class="page-sub">Manage your vendor contacts and purchase channels.</p>
                </div>
                <div class="header-actions">
                    <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                </div>
            </header>

            <section class="stats-row">
                <div class="card stat-card"><div class="stat-info"><p class="stat-label">Total Suppliers</p><h2 class="stat-value" id="statTotal">—</h2></div></div>
                <div class="card stat-card"><div class="stat-info"><p class="stat-label">With Email</p><h2 class="stat-value" id="statEmail">—</h2></div></div>
                <div class="card stat-card"><div class="stat-info"><p class="stat-label">With Phone</p><h2 class="stat-value" id="statPhone">—</h2></div></div>
            </section>

            <div class="page-action-bar">
                <input type="text" class="search-pill" placeholder="Search by name, contact or phone..." id="supplierSearch">
                <button class="btn-primary" data-role="admin,owner" id="btnAddSupplier">
                    <i class="fas fa-plus"></i> Add Supplier
                </button>
            </div>

            <div class="card" style="margin-bottom: 0;">
                <div class="data-table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Address</th>
                                <th data-role="admin,owner">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="supBody">
                            <tr><td colspan="6" style="padding:40px;text-align:center;color:#94a3b8;">Loading suppliers…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    let ALL = [];

    function renderRows(list) {
        const body = document.getElementById('supBody');
        if (!list.length) {
            body.innerHTML = '<tr><td colspan="6" style="padding:40px;text-align:center;color:#94a3b8;">No suppliers yet — add your first one.</td></tr>';
            return;
        }
        body.innerHTML = list.map(s => `
            <tr data-id="${s.id}">
                <td><strong>${escapeHtml(s.name)}</strong>
                    <div style="font-size:.75rem;color:#94a3b8;">${escapeHtml((s.notes || '').slice(0,60))}${(s.notes || '').length > 60 ? '…' : ''}</div></td>
                <td>${escapeHtml(s.contact || '—')}</td>
                <td>${escapeHtml(s.phone || '—')}</td>
                <td>${escapeHtml(s.email || '—')}</td>
                <td>${escapeHtml(s.address || '—')}</td>
                <td data-role="admin,owner">
                    <div class="row-actions">
                        <button class="btn-icon-sm" data-role="admin,owner" data-act="edit" title="Edit"><i class="fas fa-pen"></i></button>
                        <button class="btn-icon-sm danger" data-role="owner" data-act="delete" title="Delete"><i class="fas fa-trash"></i></button>
                    </div>
                </td>
            </tr>
        `).join('');
        kasbpro_applyRoleUI();
    }

    function renderStats(list) {
        document.getElementById('statTotal').textContent = list.length;
        document.getElementById('statEmail').textContent = list.filter(s => s.email).length;
        document.getElementById('statPhone').textContent = list.filter(s => s.phone).length;
    }

    async function load() {
        try {
            const data = await api('/api/suppliers');
            ALL = data.suppliers || [];
            renderStats(ALL);
            applySearch();
        } catch (e) { kasbpro_toast(e.message, 'err'); }
    }
    function applySearch() {
        const q = document.getElementById('supplierSearch').value.toLowerCase().trim();
        renderRows(ALL.filter(s =>
            !q ||
            s.name.toLowerCase().includes(q) ||
            (s.contact || '').toLowerCase().includes(q) ||
            (s.phone   || '').toLowerCase().includes(q) ||
            (s.email   || '').toLowerCase().includes(q)
        ));
    }

    async function addSupplier() {
        const v = await kasbpro_modal({
            title: 'Add Supplier', submit: 'Create',
            fields: [
                { name:'name',    label:'Company Name', type:'text', required:true },
                { name:'contact', label:'Contact Person', type:'text' },
                { name:'phone',   label:'Phone', type:'text' },
                { name:'email',   label:'Email', type:'email' },
                { name:'address', label:'Address', type:'text' },
                { name:'notes',   label:'Notes', type:'textarea' }
            ]
        });
        if (!v) return;
        try {
            await api('/api/suppliers', { method:'POST', body: v });
            kasbpro_toast('Supplier added', 'ok'); load();
        } catch (e) { kasbpro_toast(e.message, 'err'); }
    }

    async function editSupplier(s) {
        const v = await kasbpro_modal({
            title: 'Edit Supplier', submit: 'Save changes',
            fields: [
                { name:'name',    label:'Company Name', type:'text', required:true },
                { name:'contact', label:'Contact Person', type:'text' },
                { name:'phone',   label:'Phone', type:'text' },
                { name:'email',   label:'Email', type:'email' },
                { name:'address', label:'Address', type:'text' },
                { name:'notes',   label:'Notes', type:'textarea' }
            ],
            initial: s
        });
        if (!v) return;
        try {
            await api('/api/suppliers/' + s.id, { method:'PUT', body: v });
            kasbpro_toast('Saved', 'ok'); load();
        } catch (e) { kasbpro_toast(e.message, 'err'); }
    }

    async function deleteSupplier(s) {
        const ok = await kasbpro_confirm(`Delete "${s.name}"? This cannot be undone.`);
        if (!ok) return;
        try {
            await api('/api/suppliers/' + s.id, { method:'DELETE' });
            kasbpro_toast('Deleted', 'ok'); load();
        } catch (e) { kasbpro_toast(e.message, 'err'); }
    }

    /* Boot */
    (async () => {
        const ok = await kasbpro_hydrateSession();
        if (!ok) return kasbpro_requireAuth();
        kasbpro_applyRoleUI();

        document.getElementById('supplierSearch').addEventListener('input', applySearch);
        document.getElementById('btnAddSupplier').addEventListener('click', addSupplier);

        document.getElementById('supBody').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const id = +btn.closest('tr').dataset.id;
            const s = ALL.find(x => x.id === id);
            if (!s) return;
            if (btn.dataset.act === 'edit')   editSupplier(s);
            if (btn.dataset.act === 'delete') deleteSupplier(s);
        });

        const t = document.getElementById('mobileToggle');
        const sb = document.getElementById('sidebar');
        if (t && sb) t.addEventListener('click', () => sb.classList.toggle('active'));

        load();
    })();
    </script>
</body>
</html>
